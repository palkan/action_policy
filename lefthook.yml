pre-commit:
  commands:
    mdl:
      tags: style
      glob: "**/*.md"
      run: mdl {staged_files}
    lychee:
      tags: links
      glob: "**/*.md"
      run: lychee docs README.md CHANGELOG.md && test "{staged_files}"
    spellcheck:
      tags: grammar
      glob: "**/*.md"
      run: bundle exec rubocop -c .rubocop-spellcheck.yml --only Spellcheck/Spelling {staged_files}
    rubocop:
      tags: style
      glob: "**/*.md"
      run: bundle exec rubocop -c .rubocop-md.yml {staged_files}
