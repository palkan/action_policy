name: Lint Docs

on:
  push:
    branches:
    - master
    paths:
    - "*.md"
    - "**/*.md"
    - ".github/workflows/docs-lint.yml"
  pull_request:
    paths:
    - "*.md"
    - "**/*.md"
    - ".github/workflows/docs-lint.yml"

jobs:
  docs-lint:
    uses: anycable/github-actions/.github/workflows/docs-lint.yml@master
    with:
      forspell: false
      mdl-path: README.md CHANGELOG.md

  spellcheck:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: "gemfiles/rubocop.gemfile"
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: 3.4
        bundler-cache: true
    - name: Spellcheck docs
      run: |
        bundle exec rubocop -c .rubocop-spellcheck.yml --only Spellcheck/Spelling
